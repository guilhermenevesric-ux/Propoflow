<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PropoFlow • Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>PropoFlow</h1>
          <p>Propostas profissionais em minutos</p>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="/register">Criar conta</a>
      </div>
    </div>

    <div class="card" style="max-width:520px; margin:0 auto;">
      <h2 class="h2">Entrar</h2>
      <p class="small">Acesse sua conta para criar propostas e baixar PDFs.</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        {{ csrf_input(request) }}
        <label>Email</label>
        <input name="email" type="email" placeholder="seuemail@exemplo.com" required>

        <div style="height:12px;"></div>

        <label>Senha</label>
        <input name="password" type="password" placeholder="Sua senha" required>

        <div style="height:16px;"></div>

        <button class="btn" type="submit" style="width:100%;">Entrar</button>

        <div style="height:12px;"></div>

        <p class="small" style="margin:0; text-align:center;">
          Novo por aqui? <a href="/register">Criar conta</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
